<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apuração ao vivo - Observatório</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=20260804h" />
  <link rel="stylesheet" href="apuracao.css?v=20260812a" />
</head>

<body data-theme="dark">
  <div class="app-toolbar">
    <div class="toolbar-center">
      <a href="index.html" class="toolbar-logo">Observatório</a>
      <span class="toolbar-page">Apuração ao vivo</span>
    </div>
    <div class="toolbar-right">
      <span id="selo" class="apu-selo" title="Origem e horário dos dados">—</span>
      <a href="eleicoes.html" class="toolbar-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
        </svg>
        <span>Mapa Eleitoral</span>
      </a>
      <a href="index.html" class="toolbar-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Início</span>
      </a>
      <button id="themeToggle" class="toolbar-link" title="Mudar tema">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="theme-icon">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="app">
    <!-- ESQUERDA: andamento da apuracao -->
    <div class="panel side side-left">
      <div class="body">
        <div class="section">
          <h3>Apuração</h3>
          <div class="apu-progresso">
            <div class="apu-progresso-barra"><span id="barraApurada"></span></div>
            <div class="apu-progresso-rot">
              <strong id="pctApurado">—</strong>
              <span id="secoesApuradas" class="muted"></span>
            </div>
          </div>
          <div id="avisoDivulgacao" class="apu-aviso hidden"></div>
        </div>

        <div class="section">
          <h3>Participação</h3>
          <div id="participacao" class="apu-grade"></div>
        </div>

        <div class="section section-hidden" id="secaoBancada">
          <h3>Bancada</h3>
          <div id="bancada" class="apu-bancada"></div>
        </div>
      </div>
    </div>

    <!-- MAPA -->
    <div class="panel side side-res">
      <div id="map"></div>
      <button id="btnScopeBack" class="btn-scope-back hidden" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span id="btnScopeBackLabel">Brasil</span>
      </button>
      <div class="loader-overlay" id="mapLoader" style="display:none">Carregando...</div>
    </div>

    <!-- DIREITA: resultados da abrangencia em foco -->
    <div class="panel side side-right">
      <div class="section" id="electionContextBox">
        <div class="results-context">
          <div class="results-context-block">
            <div class="chip-group" id="chipsCargo"></div>
          </div>
        </div>
      </div>

      <div class="body">
        <div class="section" id="resultsBox">
          <div style="margin-bottom:12px">
            <h3 id="resultsTitle" style="margin:0; font-size:1rem; line-height:1.3;">Brasil</h3>
            <small id="resultsSubtitle"
              style="color:var(--muted); font-size:0.8rem; display:block; margin-top:2px;"></small>
          </div>
          <div class="chip-group section-hidden" id="chipsTurno" style="margin-bottom:10px"></div>
          <div id="resultsContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/globals.js?v=20260804f"></script>
  <script src="js/utils.js?v=20260804a"></script>
  <script src="js/maplibre-compat.js?v=20260619c"></script>
  <script src="js/apuracao.js?v=20260812c"></script>
</body>

</html>
