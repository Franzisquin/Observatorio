name: Apuração ao vivo

# Job longo disparado a mao, nao cron: o `schedule` do Actions tem granularidade
# minima de 5 minutos e atrasa sob carga. O loop fica dentro do proprio job, que
# pode durar ate 6 horas (limite do runner).
#
# Publica os snapshots numa branch orfa (`apuracao-data`), que o site le por
# raw.githubusercontent. Orfa porque este repositorio tem ~3,8 GB: a branch de
# dados nasce vazia e cada publicacao usa --amend, entao ela fica sempre com um
# unico commit de poucos megabytes.
#
# Repositorio publico => minutos de Actions gratuitos e ilimitados.

on:
  workflow_dispatch:
    inputs:
      eleicao:
        description: "Codigo da eleicao (sai do ele-c.json; divulgado as vesperas)"
        required: true
      cargos:
        description: "Codigos separados por virgula"
        default: "0001,0003,0005,0006,0007"
      ambiente:
        description: "Pasta de ambiente no CDN: oficial, a do simulado, ou auto para sondar"
        default: "auto"
      minutos:
        description: "Duracao do plantao (o runner corta em 6h)"
        default: "300"
      intervalo_alto:
        description: "Segundos entre voltas da camada BR+UF"
        default: "45"
      intervalo_mun:
        description: "Segundos entre voltas da camada municipal"
        default: "240"

permissions:
  contents: write

concurrency:
  group: apuracao
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout dos scripts
        uses: actions/checkout@v4
        with:
          # Sem blobs e so a pasta dos scripts: o checkout completo deste repo
          # passa de 3 GB e levaria mais tempo que a propria coleta.
          filter: blob:none
          sparse-checkout: scripts/apuracao

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar a branch de dados
        run: |
          mkdir -p publicar
          cd publicar
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git checkout -q --orphan apuracao-data

      # Antes do laco, imprime o que existe: qual ambiente respondeu, qual a fase
      # (simulado ou oficial) e quais eleicoes o EA11 lista com os seus cargos. E o
      # passo que mostra, no log, se o codigo de eleicao passado na mao esta certo —
      # numa janela de tres horas de simulado, descobrir isso pela tela vazia custa
      # a janela inteira.
      - name: Reconhecimento do CDN
        continue-on-error: true
        # As entradas passam por `env`, nao por interpolacao `${{ }}` dentro do
        # `run`. Interpolado, o valor e colado no script antes de o shell existir:
        # um `; curl ... | sh ;` no campo vira comando, com o token de escrita do
        # repositorio a mao. Como variavel de ambiente entre aspas, e so texto.
        env:
          AMBIENTE: ${{ inputs.ambiente }}
        run: |
          python scripts/apuracao/coleta.py --descobrir || true
          python scripts/apuracao/coleta.py --ambiente "$AMBIENTE" --listar \
            || echo "nao foi possivel listar com ambiente=$AMBIENTE"

      - name: Plantao
        # Mesma razao do passo anterior: entrada de formulario nao entra no corpo
        # do script, entra pelo ambiente.
        env:
          ELEICAO: ${{ inputs.eleicao }}
          CARGOS: ${{ inputs.cargos }}
          AMBIENTE: ${{ inputs.ambiente }}
          MINUTOS: ${{ inputs.minutos }}
          INTERVALO_ALTO: ${{ inputs.intervalo_alto }}
          INTERVALO_MUN: ${{ inputs.intervalo_mun }}
        run: |
          python scripts/apuracao/plantao.py \
            --eleicao "$ELEICAO" \
            --cargos "$CARGOS" \
            --ambiente "$AMBIENTE" \
            --minutos "$MINUTOS" \
            --intervalo-alto "$INTERVALO_ALTO" \
            --intervalo-mun "$INTERVALO_MUN" \
            --saida publicar \
            --publicar --branch apuracao-data
